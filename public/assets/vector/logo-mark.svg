<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 800 500"
  fill="none"
  color="#f4f4f5"
  role="img"
  aria-label="Ark Systems Seal"
>
  <defs>
    <linearGradient id="ark-accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgb(var(--color-ark-accent-rgb, 79 70 229))" />
      <stop offset="100%" stop-color="rgb(var(--color-ark-accent-to-rgb, 30 58 138))" />
    </linearGradient>

    <g id="ark-wing-unit">
      <path
        d="M 370 220 L 330 140 L 260 110 L 200 150 L 240 210 L 310 240 Z"
        stroke="currentColor"
        stroke-width="1.5"
        stroke-opacity="0.8"
      />
      <path
        d="M 260 110 L 170 80 M 240 140 L 180 120 M 250 170 L 190 160"
        stroke="currentColor"
        stroke-width="1.2"
        stroke-linecap="round"
        stroke-opacity="0.6"
      />
      <circle cx="260" cy="110" r="3.5" fill="url(#ark-accent-grad)" />
      <circle cx="170" cy="80" r="3" fill="url(#ark-accent-grad)" />
      <circle cx="200" cy="150" r="3" fill="url(#ark-accent-grad)" />
      <circle cx="330" cy="140" r="3" fill="url(#ark-accent-grad)" />
    </g>
  </defs>

  <g
    class="ark-vault"
    stroke="currentColor"
    stroke-width="1.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <rect x="260" y="230" width="280" height="150" rx="2" stroke-opacity="0.9" />
    <rect x="280" y="250" width="240" height="110" rx="1" stroke-opacity="0.4" />
    <line x1="240" y1="230" x2="560" y2="230" stroke-width="2" />
    <line x1="250" y1="380" x2="550" y2="380" stroke-width="2" />
    <line x1="230" y1="392" x2="570" y2="392" stroke-width="2.5" />
    <path d="M 260 270 L 210 270 L 180 290 L 140 290" />
    <circle cx="140" cy="290" r="3" fill="currentColor" />
    <path d="M 260 330 L 220 330 L 200 350 L 150 350" />
    <circle cx="150" cy="350" r="3" fill="currentColor" />
    <path d="M 540 270 L 590 270 L 620 290 L 660 290" />
    <circle cx="660" cy="290" r="3" fill="currentColor" />
    <path d="M 540 330 L 580 330 L 600 350 L 650 350" />
    <circle cx="650" cy="350" r="3" fill="currentColor" />
  </g>

  <g class="ark-vault-core">
    <circle cx="400" cy="305" r="42" stroke="currentColor" stroke-width="1.2" stroke-opacity="0.3" />
    <circle cx="400" cy="305" r="30" stroke="currentColor" stroke-width="1.5" stroke-opacity="0.6" />
    <circle cx="400" cy="305" r="18" stroke="url(#ark-accent-grad)" stroke-width="2" />
    <circle cx="400" cy="305" r="6" fill="url(#ark-accent-grad)" />
  </g>

  <g class="ark-sentinels">
    <use href="#ark-wing-unit" />
    <use href="#ark-wing-unit" transform="translate(800, 0) scale(-1, 1)" />
  </g>
</svg>
